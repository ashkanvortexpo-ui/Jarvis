          JARVIS_ARCHIVE
          tr -d '[:space:]' < /tmp/jarvis.b64 | base64 -d > /tmp/jarvis.zip
          unzip -q /tmp/jarvis.zip -d /tmp/jarvis
          ROOT=$(find /tmp/jarvis -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "Gradle exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo '===== FIRST USEFUL ERRORS ====='
            grep -nE '^e: |^ERROR:|What went wrong:|Execution failed for task|Caused by:' build.log | head -80 || true
            exit "$code"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-build-log
          path: build.log
          if-no-files-found: ignore
