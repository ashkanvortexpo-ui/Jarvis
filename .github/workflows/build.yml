name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Recreate project from embedded archive
        shell: bash
        run: |
          rm -rf /tmp/jarvis_src
          mkdir -p /tmp/jarvis_src
          cat > /tmp/jarvis.b64 <<'JARVIS_B64'

JARVIS_B64
          base64 -d /tmp/jarvis.b64 > /tmp/jarvis.zip
          unzip -q /tmp/jarvis.zip -d /tmp/jarvis_src
          ROOT=$(find /tmp/jarvis_src -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .
          rm -rf /tmp/jarvis_src /tmp/jarvis.zip /tmp/jarvis.b64

      - name: Verify project structure
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/res

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
